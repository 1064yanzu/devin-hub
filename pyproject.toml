[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-hub"
version = "0.1.0"
description = "Local-first event-driven development monitoring prototype"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Devin Hub contributors"}]

[project.scripts]
devin-hub = "devin_hub.__main__:main"

[tool.setuptools.packages.find]
include = ["devin_hub*"]
